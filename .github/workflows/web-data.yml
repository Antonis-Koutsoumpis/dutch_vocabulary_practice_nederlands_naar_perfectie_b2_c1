name: Update web app data

# Keeps docs/data/words.json (the web app on GitHub Pages) in sync with the Excel file.
on:
  push:
    branches: [main]
    paths: ["*.xlsx", "scripts/export_web.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl
      - run: python scripts/export_web.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "Update web app data from the Excel file" && git push)
